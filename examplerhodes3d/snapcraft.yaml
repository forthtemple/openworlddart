name: rhodes3d # you probably want to 'snapcraft register <name>'
base: core22 # the base snap is the execution environment for this snap
version: '0.1' # just for humans, typically '1.2+git' or '1.3.2'
summary: Explore Lindos # 79 char long summary
description: |
  It's 1522 in Lindos on the southern Greek island of Rhode right before a huge invasion from Suleiman and his huge army. Help the people of Lindos uncover a spy who is giving the enemy information. Save Lindos from their coming doom.
icon: snap/gui/rhodes3d.png
website: https://github.com/forthtemple/openworlddart/blob/main/examplerhodes3d/README.md
source-code: https://github.com/forthtemple/openworlddart/blob/main/examplerhodes3d/README.md

grade: stable #devel # # # must be '' to release into candidate/stable channels
confinement: strict #devmode # # # use 'strict' once you have the right plugs and slots

# Build on this machine (Ubuntu 22.04 = core22), from examplerhodes3d:
#   sudo snapcraft pack --destructive-mode
#   sudo chown -R $USER:$USER .. ~/.pub-cache
# The game is built in place in this folder, so openworld at ../ is found
# exactly as in a normal `flutter build linux`.

apps:
  rhodes3d:
    command: rhodes3d
    extensions: [gnome]
    plugs:
      - opengl
      - audio-playback
    environment:
      # audioplayers plays through GStreamer: use the plugins bundled in the snap
      GST_PLUGIN_SYSTEM_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gstreamer-1.0
      GST_PLUGIN_SCANNER: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gstreamer1.0/gstreamer-1.0/gst-plugin-scanner

parts:
  rhodes3d:
    source: .
    source-type: local
    plugin: flutter   # kept so its build tools (clang, cmake, ninja, GTK) are installed
    flutter-target: lib/main.dart
    # Own build steps: build in the real project folder (so ../openworld and
    # any path dependency_overrides resolve) with a pinned Flutter version.
    # The plugin otherwise uses the latest stable Flutter, which may not work
    # with flutter_angle 0.3.9.
    override-build: |
      set -e
      FLUTTER_VERSION=3.35.3
      if [ ! -d "$CRAFT_PART_BUILD/flutter-distro" ]; then
        git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$CRAFT_PART_BUILD/flutter-distro"
      fi
      export PATH="$CRAFT_PART_BUILD/flutter-distro/bin:$PATH"
      flutter config --no-analytics
      flutter precache --linux
      cd "$CRAFT_PROJECT_DIR"
      flutter pub get
      flutter build linux --release -v --target lib/main.dart
      cp -r build/linux/*/release/bundle/* "$CRAFT_PART_INSTALL/"
    build-packages:
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev
      - libglew-dev
      - libatlas-base-dev
    stage-packages:
      - libgstreamer1.0-0
      - libgstreamer-plugins-base1.0-0
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-pulseaudio
      - libglew2.2
      - libatlas3-base
    organize:
      usr/lib/*-linux-gnu/blas/*: usr/lib/
      usr/lib/*-linux-gnu/lapack/*: usr/lib/
      usr/lib/*-linux-gnu/atlas/*: usr/lib/
